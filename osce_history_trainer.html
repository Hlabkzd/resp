
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans)}
#app{width:100%;min-height:600px;display:flex;flex-direction:column}

#select-screen{padding:24px 16px;display:flex;flex-direction:column;gap:16px}
.select-intro{font-size:13px;color:var(--color-text-secondary);line-height:1.6}
.case-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.case-card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:14px;cursor:pointer;transition:border-color 0.15s,background 0.15s}
.case-card:hover{border-color:var(--color-border-primary);background:var(--color-background-secondary)}
.case-tag{font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:0.06em;padding:2px 8px;border-radius:20px;display:inline-block;margin-bottom:8px}
.case-name{font-size:14px;font-weight:500;color:var(--color-text-primary);margin-bottom:3px}
.case-complaint{font-size:12px;color:var(--color-text-secondary);line-height:1.5}
#chat-screen{display:none;flex:1;flex-direction:column;min-height:580px}
.chat-top{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:0.5px solid var(--color-border-tertiary);background:var(--color-background-secondary)}
.patient-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;flex-shrink:0}
.chat-top-info{flex:1}
.chat-top-name{font-size:14px;font-weight:500;color:var(--color-text-primary)}
.chat-top-sub{font-size:12px;color:var(--color-text-secondary)}
.back-btn{font-size:12px;color:var(--color-text-secondary);cursor:pointer;padding:5px 10px;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);background:transparent}
.back-btn:hover{background:var(--color-background-secondary)}
.chat-body{display:flex;flex:1;min-height:0;overflow:hidden}
.chat-msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;min-height:300px;max-height:380px}
.sidebar{width:200px;flex-shrink:0;border-left:0.5px solid var(--color-border-tertiary);padding:12px;overflow-y:auto;background:var(--color-background-secondary)}
.sidebar-title{font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:0.07em;color:var(--color-text-tertiary);margin-bottom:10px}
.check-item{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--color-text-secondary);padding:3px 0;transition:color 0.2s}
.check-item.done{color:var(--color-text-success)}
.check-item i{font-size:14px;color:var(--color-border-tertiary);transition:color 0.2s}
.check-item.done i{color:#1D9E75}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:88%}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.msg-bubble{padding:9px 13px;border-radius:16px;font-size:13px;line-height:1.6;color:var(--color-text-primary);border:0.5px solid var(--color-border-tertiary);background:var(--color-background-primary)}
.msg.user .msg-bubble{background:var(--color-background-info);border-color:transparent;color:var(--color-text-info)}
.msg-avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;flex-shrink:0}
.typing{display:flex;gap:4px;align-items:center;padding:9px 13px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--color-text-tertiary);animation:blink 1.2s ease-in-out infinite}

.dot:nth-child(3){animation-delay:0.4s}

.chip{font-size:11px;padding:4px 10px;border-radius:20px;border:0.5px solid var(--color-border-tertiary);cursor:pointer;color:var(--color-text-secondary);background:var(--color-background-primary);transition:all 0.1s}

.chat-input{flex:1;padding:8px 12px;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);font-size:13px;font-family:var(--font-sans);color:var(--color-text-primary);background:var(--color-background-primary);resize:none;outline:none}
.chat-input:focus{border-color:var(--color-border-secondary)}
.send-btn{padding:8px 14px;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);cursor:pointer;font-size:13px;font-family:var(--font-sans);color:var(--color-text-primary);background:var(--color-background-secondary);transition:background 0.1s}
.send-btn:hover{background:var(--color-background-tertiary)}
.fb-btn{margin:0 14px 10px;padding:7px 14px;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);cursor:pointer;font-size:12px;font-family:var(--font-sans);color:var(--color-text-secondary);background:transparent;width:calc(100% - 28px)}
.fb-btn:hover{background:var(--color-background-secondary);color:var(--color-text-primary)}
.fb-panel{margin:0 14px 14px;padding:14px;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);background:var(--color-background-secondary);font-size:12px;line-height:1.7;color:var(--color-text-secondary);display:none}
.fb-row{margin-bottom:8px}
.fb-label{font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:4px}
.score-bar-wrap{height:6px;background:var(--color-background-tertiary);border-radius:3px;overflow:hidden;margin-top:4px}
.score-bar{height:100%;border-radius:3px;transition:width 0.4s}
</style>

  {id:"severity", label:"Severity (1-10)"},
  {id:"prev", label:"Previous episodes"},
  {id:"pmh", label:"Past medical history"},
  {id:"meds", label:"Medications"},
  {id:"allergy", label:"Allergies"},
  {id:"social", label:"Social history"},
  {id:"family", label:"Family history"},
  {id:"ice", label:"Ideas/concerns/expectations"}
];

const CHIPS = [
  "Can you describe the pain?",
  "Where exactly do you feel it?",
  "Does it radiate anywhere?",
  "What makes it better or worse?",
  "Any associated symptoms?",
  "Do you take any medications?",
  "Any family history of note?"
];

let currentCase = null;
let messages = [];
let checkedItems = new Set();
let isLoading = false;

function renderCaseGrid() {
  const grid = document.getElementById("case-grid");
  const categories = ["Cardiac","Respiratory","Musculoskeletal"];
  let html = "";
  categories.forEach(cat => {
    const cases = CASES.filter(c => c.tag === cat);
    if (cases.length === 0) return;
    html += `<div style="grid-column:1/-1;font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:0.06em;color:var(--color-text-tertiary);margin-bottom:2px">${cat}</div>`;
    cases.forEach(c => {
      html += `<div class="case-card" onclick="selectCase('${c.id}')">
        <span class="case-tag" style="${c.tagColor}">${c.tag}</span>
        <div class="case-name">${c.name}</div>
        <div class="case-complaint">${c.age}y/o — ${c.complaint}</div>
      </div>`;
    });
  });
  grid.innerHTML = html;
}

function selectCase(id) {
  currentCase = CASES.find(c => c.id === id);
  if (!currentCase) return;
  messages = [];
  checkedItems = new Set();
  document.getElementById("select-screen").style.display = "none";
  document.getElementById("chat-screen").style.display = "flex";
  document.getElementById("status-pill").textContent = "session active";
  document.getElementById("status-pill").className = "pill active";
  const av = document.getElementById("chat-avatar");
  av.textContent = currentCase.initials;
  av.style.background = currentCase.avatarBg;
  av.style.color = currentCase.avatarColor;
  document.getElementById("chat-name").textContent = currentCase.name;
  document.getElementById("chat-sub").textContent = currentCase.age + " y/o · " + currentCase.tag;
  renderChecklist();
  renderChips();
  const msgs = document.getElementById("chat-msgs");
  msgs.innerHTML = "";
  addMsg("patient", `Hello, I'm ${currentCase.name.split("/")[0].trim()}. Please, come in.`);
  document.getElementById("fb-panel").style.display = "none";
  document.getElementById("chat-input").value = "";
  document.getElementById("chat-input").focus();
}

function goBack() {
  document.getElementById("select-screen").style.display = "flex";
  document.getElementById("chat-screen").style.display = "none";
  document.getElementById("status-pill").textContent = "select a case";
  document.getElementById("status-pill").className = "pill";
  currentCase = null;
}

function renderChecklist() {
  const el = document.getElementById("checklist");
  el.innerHTML = CHECKLIST_ITEMS.map(item => `
    <div class="check-item ${checkedItems.has(item.id) ? 'done' : ''}" id="chk_${item.id}">
      <i class="ti ti-${checkedItems.has(item.id) ? 'circle-check-filled' : 'circle'}" aria-hidden="true"></i>
      <span>${item.label}</span>
    </div>`).join("");
}

function renderChips() {
  const el = document.getElementById("chips");
  el.innerHTML = CHIPS.map(c => `<span class="chip" onclick="useChip('${c.replace(/'/g,"\\'")}')">` + c + `</span>`).join("");
}

function useChip(text) {
  document.getElementById("chat-input").value = text;
  sendMsg();
}

function addMsg(role, text) {
  const msgs = document.getElementById("chat-msgs");
  const div = document.createElement("div");
  div.className = "msg " + (role === "user" ? "user" : "patient");
  const av = document.createElement("div");
  av.className = "msg-avatar";
  if (role === "user") {
    av.textContent = "You";
    av.style.background = "var(--color-background-info)";
    av.style.color = "var(--color-text-info)";
    av.style.fontSize = "9px";
  } else {
    av.textContent = currentCase ? currentCase.initials : "Pt";
    av.style.background = currentCase ? currentCase.avatarBg : "#eee";
    av.style.color = currentCase ? currentCase.avatarColor : "#333";
  }
  const bubble = document.createElement("div");
  bubble.className = "msg-bubble";
  bubble.textContent = text;
  div.appendChild(av);
  div.appendChild(bubble);
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function addTyping() {
  const msgs = document.getElementById("chat-msgs");
  const div = document.createElement("div");
  div.className = "msg patient";
  div.id = "typing-indicator";
  const av = document.createElement("div");
  av.className = "msg-avatar";
  av.textContent = currentCase ? currentCase.initials : "Pt";
  av.style.background = currentCase ? currentCase.avatarBg : "#eee";
  av.style.color = currentCase ? currentCase.avatarColor : "#333";
  const bubble = document.createElement("div");
  bubble.className = "msg-bubble typing";
  bubble.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
  div.appendChild(av);
  div.appendChild(bubble);
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
  return div;
}

function removeTyping() {
  const el = document.getElementById("typing-indicator");
  if (el) el.remove();
}

function updateChecklist(userMsg, patientReply) {
  const combined = (userMsg + " " + patientReply).toLowerCase();
  const checks = {
    intro: /(hello|hi|my name|i'm dr|i am dr|introduce|consent|call you|how are you|good (morning|afternoon|evening))/,
    pc: /(what brings|main problem|what.*wrong|presenting|complain|what seem|what's the matter|tell me about)/,
    onset: /(when|how long|start|begin|onset|first notice|ago|since)/,
    character: /(describe|feel like|type of pain|what.*pain|ache|sharp|dull|tight|pressure|heavy|burn|crush|character)/,
    radiation: /(radiat|spread|move|travel|arm|jaw|back|neck|anywhere else)/,
    assoc: /(other|associated|nausea|sweat|dizz|breath|cough|sputum|wheeze|fever|vomit|palpitat)/,
    timing: /(how often|frequent|long does it last|timing|constant|intermittent|how many|episodes per)/,
    exac: /(worse|better|relieve|aggravat|trigger|cause|help|improve|exacerbat|makes it)/,
    severity: /(scale|1 to 10|score|how bad|severe|intensity|rate the)/,
    prev: /(before|previous|ever had|history of this|similar episode|in the past|ever experienced)/,
    pmh: /(medical history|conditions|health generally|hospital|operations|medical problem|past history|any illness)/,
    meds: /(medication|tablets|pills|drugs|taking|prescribed|medicines)/,
    allergy: /(allerg|react|penicillin|latex|intoleran)/,
    social: /(smok|drink|alcohol|work|live|family|occupation|home|stress|exercise|social)/,
    family: /(family history|parents|siblings|brother|sister|children|relatives|run in the family)/,
    ice: /(worried|concern|think it|what do you think|expect|hope|fear|afraid|anxious about)/
  };
  let changed = false;
  for (const [key, regex] of Object.entries(checks)) {
    if (!checkedItems.has(key) && regex.test(combined)) {
      checkedItems.add(key);
      changed = true;
    }
  }
  if (changed) renderChecklist();
}

async function sendMsg() {
  if (!currentCase || isLoading) return;
  const input = document.getElementById("chat-input");
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  addMsg("user", text);
  isLoading = true;
  addTyping();
  const convHistory = messages.map(m => ({role: m.role, content: m.content}));
  convHistory.push({role:"user", content: text});
  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        model:"claude-sonnet-4-20250514",
        max_tokens:300,
        system: currentCase.systemPrompt + "\n\nIMPORTANT: Reply in 1-3 short sentences only, as a real patient would. Do not give medical commentary. Stay in character at all times.",
        messages: convHistory
      })
    });
    const data = await res.json();
    const reply = data.content && data.content[0] ? data.content[0].text : "Sorry, I didn't catch that.";
    removeTyping();
    addMsg("patient", reply);
    messages.push({role:"user", content: text});
    messages.push({role:"assistant", content: reply});
    updateChecklist(text, reply);
  } catch(e) {
    removeTyping();
    addMsg("patient", "Sorry, could you repeat that?");
  }
  isLoading = false;
}

async function getFeedback() {
  if (!currentCase || isLoading || messages.length < 2) return;
  isLoading = true;
  const fbPanel = document.getElementById("fb-panel");
  fbPanel.style.display = "block";
  fbPanel.innerHTML = '<div style="color:var(--color-text-tertiary);font-size:12px">Getting examiner feedback...</div>';
  const convo = messages.map(m => `${m.role === "user" ? "Student" : "Patient"}: ${m.content}`).join("\n");
  const covered = CHECKLIST_ITEMS.filter(i => checkedItems.has(i.id)).map(i => i.label);
  const missed = CHECKLIST_ITEMS.filter(i => !checkedItems.has(i.id)).map(i => i.label);
  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        model:"claude-sonnet-4-20250514",
        max_tokens:500,
        system:`You are an RCSI OSCE examiner giving brief structured feedback on a Year 1 student's history-taking. Be direct and constructive. Output ONLY valid JSON, no markdown, no extra text.`,
        messages:[{role:"user", content:`Patient: ${currentCase.name}, ${currentCase.age}y/o, ${currentCase.tag}\n\nConversation:\n${convo}\n\nCovered areas: ${covered.join(", ")}\nMissed areas: ${missed.join(", ")}\n\nReturn JSON with these exact keys:\n{"score": <0-10 integer>, "good": ["one strength"], "improve": ["one improvement"], "missed": ["key missed item if any"], "summary": "2 sentence overall comment"}`}]
      })
    });
    const data = await res.json();
    let txt = data.content[0].text.replace(/```json|```/g,"").trim();
    const fb = JSON.parse(txt);
    const pct = fb.score * 10;
    const barColor = pct >= 70 ? "#1D9E75" : pct >= 40 ? "#BA7517" : "#A32D2D";
    fbPanel.innerHTML = `
      <div class="fb-row">
        <div class="fb-label" style="color:var(--color-text-secondary)">Score</div>
        <div style="display:flex;align-items:center;gap:10px">
          <span style="font-size:18px;font-weight:500;color:var(--color-text-primary)">${fb.score}/10</span>
          <div class="score-bar-wrap" style="flex:1"><div class="score-bar" style="width:${pct}%;background:${barColor}"></div></div>
        </div>
      </div>
      <div class="fb-row" style="margin-top:10px">
        <div class="fb-label" style="color:#1D9E75">Well done</div>
        <div class="fb-text">${(fb.good||[]).join("; ")}</div>
      </div>
      <div class="fb-row">
        <div class="fb-label" style="color:#BA7517">Improve</div>
        <div class="fb-text">${(fb.improve||[]).join("; ")}</div>
      </div>
      ${fb.missed && fb.missed.length ? `<div class="fb-row"><div class="fb-label" style="color:#A32D2D">Missed</div><div class="fb-text">${fb.missed.join("; ")}</div></div>` : ""}
      <div style="margin-top:10px;padding-top:10px;border-top:0.5px solid var(--color-border-tertiary);font-size:12px;color:var(--color-text-secondary);line-height:1.6">${fb.summary}</div>`;
  } catch(e) {
    fbPanel.innerHTML = '<div style="color:var(--color-text-danger);font-size:12px">Could not load feedback. Try again.</div>';
  }
  isLoading = false;
}

document.getElementById("chat-input").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMsg(); }
});

renderCaseGrid();
</script>
